<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Studio, l'intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<!--
  ============================================================
  INTRO D'IDEA STUDIO : maquette de référence (9 nov. 2026, v12, « bande-annonce longue, avec le son »)
  ============================================================
  Ce fichier s'ouvre tout seul : double-clique dessus. Les vidéos intro.webm et intro.mp4
  doivent être dans le même dossier.

  C'est une VIDÉO (toujours fluide, même sur une carte graphique intégrée) : 1920×1080, 60 images/s,
  27 s, avec une bande-son originale. Tout est calé sur une grille musicale à 128 BPM :
    0 à 3,8 s     : un rai de lumière dans la poussière. Une étincelle tombe : « One idea. »
    4,2 à 7,5 s   : autour d'elle, les 7 agents s'allument sur les temps, chacun avec sa note.
                    « Seven minds. » sur un grand « braam ».
    8,4 à 15 s    : les portraits. La caméra vole d'un agent à l'autre, et chacun se présente :
                    Creative, Critic, Technical, Business, Market, Innovation, Risk.
    15,9 à 16,9 s : l'analyse : chaque agent envoie un rayon vers l'idée.
    16,9 à 19,3 s : le débat : 21 échanges de plus en plus rapides, qui dessinent toutes les liaisons
                    possibles entre les 7 agents. Leurs idées s'envolent vers toi.
    19,3 à 19,7 s : arrêt sur image. Silence. Une seule note. « One verdict. »
    19,7 à 21,1 s : tout s'effondre en spirale dans l'idée ; la caméra plonge dans le point blanc : impact.
    21,1 à 23,9 s : sur le blanc : « Strengths. », « Risks. », « Solutions. », puis « You decide. » avec les
                    boutons Accept / Refuse (Accept est choisi).
    23,9 à 26,2 s : « Idea Studio » s'écrit à l'encre, puis les 7 couleurs avec leurs 7 notes.
  Puis, EN DIRECT : le blanc est ta zone d'écriture vue de très près, et la caméra recule jusqu'à
  l'accueil, pendant que la musique finit.

  Le son : les navigateurs refusent de lancer une vidéo AVEC le son toute seule. Si c'est le cas,
  un petit écran noir demande un clic ou une touche (« Clique ou appuie sur une touche… »).

  Règles :
    - Bouton « Passer » + touches Échap, Entrée, Espace. Taper une lettre pendant l'intro la saute et
      met la lettre dans la zone d'écriture.
    - Une seule fois par jour (mémorisé dans le navigateur). Ici, dans la démo, elle se joue
      à chaque fois, et le bouton « Revoir l'intro » la relance.
    - Si l'ordinateur demande moins d'animations (prefers-reduced-motion), ou si la vidéo ne peut
      pas se lire, pas d'intro : on arrive directement sur l'accueil.

  Pour Claude Code : copie intro.webm et intro.mp4 dans web/, la partie « INTRO » (CSS + script)
  dans web/intro.css et web/intro.js, puis :
      IntroIdeaStudio.lancer({
        video: ['intro.webm', 'intro.mp4'],
        cible: '#composer',          // la zone d'écriture (son fond doit être exactement #ECECEC)
        champ: 'textarea',           // le champ où placer le curseur à la fin
        page: '.colonne',            // le bloc qui « recule » : SEULEMENT la colonne du salut et de la
                                     //  zone d'écriture (pas la barre latérale : le reste apparaît en fondu)
        quandArrive: () => { ... },  // le recul a commencé : lance l'effet encre du salut
        quandFini: () => { ... },    // l'intro est finie : lance ici le chargement lourd
      });
  sans « forcer: true ». Pendant l'intro, la classe « intro-actif » est posée sur <html> :
  sers-t'en pour cacher le salut (sinon il clignote).
  Les fichiers qui fabriquent la vidéo et le son sont dans maquette/fabrication/.
-->
<style>
/* ============ PAGE D'ACCUEIL (simplifiée, seulement pour la démo) ============ */
:root{
  --noir:#000; --panneau:#111111; --survol:#1C1C1C; --ligne:#2A2A2A;
  --texte:#F0F0F0; --secondaire:#A4A4A4; --legende:#8F8F8F;
  --papier:#ECECEC; --filet:#D3D3D3; --encre:#151515; --grise:#656565;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--noir);color:var(--texte);
  font-family:'Instrument Sans',ui-sans-serif,system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.accueil{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.colonne{width:min(720px,100%);display:grid;gap:12px}
.salut{margin:0;font-size:40px;line-height:1.1;font-weight:500;letter-spacing:-.025em}
.sous{margin:0 0 20px;font-size:17px;line-height:1.45;color:var(--secondaire)}
.composer{background:var(--papier);border-radius:16px;padding:18px 18px 12px;min-height:150px;
  display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.composer textarea{width:100%;min-height:72px;resize:none;border:0;padding:0;background:transparent;
  color:var(--encre);font:inherit;font-size:18px;line-height:1.45;outline:none;caret-color:var(--encre)}
.composer textarea::placeholder{color:var(--grise);opacity:1}
.barre{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reglages{display:flex;gap:8px}
.puce{height:32px;padding:0 12px;border-radius:999px;border:1px solid #C9C9C9;background:transparent;
  color:#2B2B2B;font:inherit;font-size:13px}
.puce.active{background:var(--encre);border-color:var(--encre);color:var(--papier)}
.envoyer{width:40px;height:40px;border-radius:999px;border:0;background:var(--encre);color:var(--papier);
  opacity:.35;display:grid;place-items:center}
.revoir{position:fixed;top:16px;right:16px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--ligne);
  background:transparent;color:var(--secondaire);font:inherit;font-size:13px;cursor:pointer;
  transition:color .18s,background .18s}
.revoir:hover{color:var(--texte);background:var(--survol)}
.revoir:focus-visible{outline:2px solid #E9E9E9;outline-offset:2px}
@media (max-width:860px){.salut{font-size:32px}}
.a-ink{animation:ink .9s var(--ease) backwards}
.a-rise{animation:rise .7s var(--ease) .15s backwards}
@keyframes ink{from{opacity:0;filter:blur(6px);transform:translateY(4px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.a-ink,.a-rise{animation:none}}
/* Pendant l'intro, le salut reste caché (il apparaîtra à l'encre pendant le recul). */
html.intro-actif .salut, html.intro-actif .sous{opacity:0}

/* ============ INTRO (à copier dans web/intro.css) ============ */
.intro{position:fixed;inset:0;z-index:1000;background:#000;overflow:hidden}
.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
/* L'écran d'entrée (seulement si le navigateur bloque le son) */
.intro-porte{position:absolute;inset:0;display:grid;place-items:center;text-align:center;cursor:pointer;background:#000;
  transition:opacity .5s cubic-bezier(.2,.8,.2,1)}
.intro-porte.partie{opacity:0;pointer-events:none}
.intro-porte .point{width:10px;height:10px;border-radius:999px;background:#ECECEC;margin:0 auto 26px;
  animation:intro-respire 1.875s ease-in-out infinite}
@keyframes intro-respire{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.7);opacity:1}}
.intro-porte p{margin:0;color:#D6D6D6;font-size:16px;line-height:1.45}
.intro-porte small{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;color:#8F8F8F;font-size:13px}
.intro-passer{position:absolute;right:16px;bottom:20px;height:40px;padding:0 16px;border-radius:999px;
  border:1px solid #2A2A2A;background:transparent;color:#A4A4A4;font:inherit;font-size:14px;cursor:pointer;
  transition:color .25s,border-color .25s,background .18s,opacity .3s}
.intro-passer:hover{color:#F0F0F0;background:#1C1C1C}
.intro-passer:focus-visible{outline:2px solid #E9E9E9;outline-offset:2px}
.intro-progres{position:absolute;left:0;right:0;bottom:0;height:2px;background:#111111;transition:background .25s,opacity .3s}
.intro-progres i{display:block;height:100%;background:#5D5D5D;transform-origin:left center;transform:scaleX(0);transition:background .25s}
/* Sur le blanc de la fin de la vidéo : bouton et barre en gris foncé, lisibles */
.intro.sur-blanc .intro-passer{color:#5D5D5D;border-color:#C9C9C9}
.intro.sur-blanc .intro-passer:hover{background:#E3E3E3;color:#151515}
.intro.sur-blanc .intro-progres{background:#D3D3D3}
.intro.sur-blanc .intro-progres i{background:#8F8F8F}
@media (pointer:coarse){.intro-passer{height:44px}}
</style>
</head>
<body>

<!-- ============ PAGE D'ACCUEIL (démo) ============ -->
<main class="accueil">
  <div class="colonne">
    <h1 class="salut a-ink" id="salut">Bonsoir, Ayoub.</h1>
    <p class="sous a-rise" id="sous">Pose une question à plusieurs IA, ou fais débattre une idée.</p>
    <div class="composer" id="composer">
      <textarea aria-label="Ta question" placeholder="Pose ta question…"></textarea>
      <div class="barre">
        <div class="reglages">
          <button class="puce active" type="button">Question</button>
          <button class="puce" type="button">Idée</button>
          <button class="puce" type="button">Normal</button>
        </div>
        <button class="envoyer" type="button" aria-label="Envoyer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</main>
<button class="revoir" type="button" id="revoir">Revoir l'intro</button>

<!-- ============ INTRO (à copier dans web/intro.js) ============ -->
<script>
(function () {
  'use strict';

  // Repères dans la vidéo (en secondes) : la musique est à 128 BPM, un temps = 0,46875 s
  const DEBUT_BLANC = 21.09375; // tout l'écran devient blanc (l'impact), au temps 45
  const DEBUT_RECUL = 26.25;    // la caméra commence à reculer vers l'accueil (temps 56 ; la musique continue)
  const RECUL = 1300;           // la durée du recul (en millisecondes)
  const VOLUME = 0.85;
  const CLE = 'ideaStudio.introVue';

  // ---- Une fois par jour ----
  function aujourdhui() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function dejaVue() { try { return localStorage.getItem(CLE) === aujourdhui(); } catch (e) { return false; } }
  function marquerVue() { try { localStorage.setItem(CLE, aujourdhui()); } catch (e) {} }

  function cree(tag, classe, parent) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (parent) parent.appendChild(e);
    return e;
  }

  let enCours = null; // l'intro qui joue en ce moment (pour ne pas en lancer deux)

  function lancer(options) {
    options = options || {};
    if (enCours) return;
    const quandArrive = options.quandArrive || function () {};
    const quandFini = options.quandFini || function () {};
    const sansIntro = () => { quandArrive(); quandFini(); };
    if (!options.forcer && dejaVue()) { sansIntro(); return; }
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { sansIntro(); return; }
    marquerVue();

    const racineHtml = document.documentElement;
    racineHtml.classList.add('intro-actif');

    // ---- Le calque de l'intro et la vidéo ----
    const racine = cree('div', 'intro', document.body);
    racine.setAttribute('role', 'presentation');
    racine.setAttribute('lang', 'en');
    enCours = racine;
    const video = cree('video', '', racine);
    video.playsInline = true;
    video.preload = 'auto';
    video.volume = VOLUME;
    video.setAttribute('aria-hidden', 'true');
    [].concat(options.video || ['intro.webm', 'intro.mp4']).forEach(src => {
      const s = cree('source', '', video);
      s.src = src;
      s.type = /\.webm$/i.test(src) ? 'video/webm' : 'video/mp4';
    });
    const passer = cree('button', 'intro-passer', racine);
    passer.type = 'button';
    passer.textContent = 'Passer';
    passer.setAttribute('aria-label', 'Passer l’intro');
    const piste = cree('div', 'intro-progres', racine);
    const barre = cree('i', '', piste);
    let porte = null;

    // ---- La page, dessous : figée pendant l'intro (pas de défilement, pas de Tab) ----
    const ancienOverflow = racineHtml.style.overflow;
    racineHtml.style.overflow = 'hidden';
    const inertes = Array.from(document.body.children).filter(e => e !== racine && !e.inert && e.tagName !== 'SCRIPT');
    inertes.forEach(e => { e.inert = true; });

    const zone = document.querySelector(options.cible || '#composer');
    const champ = zone ? zone.querySelector(options.champ || 'textarea') : null;
    const page = zone ? (zone.closest(options.page || 'main') || zone.parentElement) : null;
    const autour = page ? inertes.filter(e => e !== page && !e.contains(page)) : [];
    let ancienneOrigine = '', ancienneTransfo = '', s0 = 1;
    if (page) { ancienneOrigine = page.style.transformOrigin; ancienneTransfo = page.style.transform; }

    // Astuce du recul : on agrandit la page autour de la zone d'écriture, si fort que cette zone
    // remplit l'écran du même blanc que la fin de la vidéo. Au bon moment, on retire l'image de la
    // vidéo en fondu (on ne voit aucune différence), puis la page rétrécit jusqu'à sa taille normale.
    function preparerPage() {
      if (!zone || !page) return;
      const L = window.innerWidth, H = window.innerHeight;
      page.style.transform = '';
      const rz = zone.getBoundingClientRect(), rp = page.getBoundingClientRect();
      const zx = rz.left + rz.width / 2, zy = rz.top + rz.height / 2;
      s0 = 1.1 * Math.max(2 * Math.max(zx, L - zx) / rz.width, 2 * Math.max(zy, H - zy) / rz.height);
      page.style.transformOrigin = (zx - rp.left) + 'px ' + (zy - rp.top) + 'px';
      page.style.transform = 'scale(' + s0 + ')';
      Array.from(zone.children).forEach(c => { c.style.opacity = '0'; });
      autour.forEach(e => { e.style.opacity = '0'; });
    }
    function rendrePage() {
      if (page) { page.style.transform = ancienneTransfo; page.style.transformOrigin = ancienneOrigine; }
      if (zone) Array.from(zone.children).forEach(c => { c.style.opacity = ''; });
      autour.forEach(e => { e.style.opacity = ''; });
    }
    // Baisse le son en douceur (au lieu de le couper net)
    function fonduSon(duree) {
      const v0 = video.volume, t0 = performance.now();
      return new Promise(fin => {
        (function pas() {
          const u = Math.min(1, (performance.now() - t0) / duree);
          try { video.volume = v0 * (1 - u); } catch (e) {}
          if (u < 1) requestAnimationFrame(pas); else fin();
        })();
      });
    }

    // ---- Fin ----
    let etat = 'attente';  // 'attente' (écran d'entrée) -> 'video' -> 'recul' -> 'fini'
    let arriveeFaite = false, lettre = '', minuteurs = [], animsRecul = [], boucle = 0;
    function arrive() {
      if (arriveeFaite) return;
      arriveeFaite = true;
      racineHtml.classList.remove('intro-actif');
      quandArrive();
    }
    function nettoyer() {
      minuteurs.forEach(clearTimeout);
      cancelAnimationFrame(boucle);
      document.removeEventListener('keydown', touche);
      window.removeEventListener('resize', redimension);
    }
    function terminer() {
      if (etat === 'fini') return;
      etat = 'fini';
      nettoyer();
      animsRecul.forEach(a => a.cancel());
      arrive();
      rendrePage();
      racineHtml.style.overflow = ancienOverflow;
      inertes.forEach(e => { e.inert = false; });
      enCours = null;
      // La musique peut finir sa dernière note, puis on retire la vidéo
      const retirer = () => { video.pause(); racine.remove(); };
      if (!video.paused && !video.ended) fonduSon(500).then(retirer); else retirer();
      // Le curseur passe dans la vraie zone d'écriture (pas sur téléphone : ça ouvrirait le clavier)
      const sourisFine = window.matchMedia && matchMedia('(pointer: fine)').matches;
      if (champ && (sourisFine || lettre)) {
        champ.focus({ preventScroll: true });
        if (lettre) { champ.value += lettre; champ.dispatchEvent(new Event('input', { bubbles: true })); }
      }
      quandFini();
    }
    // Le blanc est là : la caméra recule jusqu'à l'accueil (la vidéo continue, invisible, pour la musique)
    function reculer() {
      if (etat !== 'video') return;
      if (!zone || !page) { sauter(); return; }
      etat = 'recul';
      racine.style.pointerEvents = 'none';
      animsRecul.push(racine.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: 'linear', fill: 'forwards' }));
      const images = [];
      for (let k = 0; k <= 16; k++) images.push({ transform: 'scale(' + Math.pow(s0, 1 - k / 16).toFixed(4) + ')' });
      const recul = page.animate(images, { duration: RECUL, easing: 'cubic-bezier(.45,0,.15,1)', fill: 'forwards' });
      animsRecul.push(recul);
      Array.from(zone.children).forEach(c => animsRecul.push(
        c.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 520, delay: RECUL * 0.6, easing: 'ease-out', fill: 'forwards' })));
      autour.forEach(e => animsRecul.push(
        e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 440, delay: RECUL * 0.8, easing: 'ease-out', fill: 'forwards' })));
      minuteurs.push(setTimeout(arrive, RECUL * 0.3));  // le salut s'écrit quand il est déjà dans l'image
      recul.finished.then(terminer, () => {});
    }
    function sauter() {
      if (etat === 'fini' || etat === 'saut') return;
      if (etat === 'recul') { animsRecul.forEach(a => { try { a.updatePlaybackRate(4); } catch (e) {} }); return; }
      etat = 'saut';
      arrive();
      rendrePage();
      fonduSon(220);
      racine.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: 'ease-out', fill: 'forwards' })
        .finished.then(() => { etat = 'video'; terminer(); }, () => { etat = 'video'; terminer(); });
    }
    function touche(e) {
      if (etat === 'attente') {
        if (e.key === 'Escape') { e.preventDefault(); sauter(); return; }
        if (e.key && !['Shift', 'Control', 'Alt', 'Meta', 'Tab'].includes(e.key)) { e.preventDefault(); demarrerAvecSon(); }
        return;
      }
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sauter(); return; }
      // Une lettre tapée pendant l'intro : on la saute et la lettre va dans la zone d'écriture
      if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        if (!lettre) lettre = e.key;
        sauter();
      }
    }
    // Un vrai changement de taille de fenêtre : on saute (les petits changements sont ignorés)
    const L0 = window.innerWidth, H0 = window.innerHeight;
    function redimension() {
      if (Math.abs(window.innerWidth - L0) > 40 || Math.abs(window.innerHeight - H0) > H0 * 0.2) sauter();
    }
    passer.addEventListener('click', e => { e.stopPropagation(); sauter(); });
    document.addEventListener('keydown', touche);
    window.addEventListener('resize', redimension);

    // ---- La barre de progression suit la vidéo ----
    function suivre() {
      if (video.duration) {
        barre.style.transform = 'scaleX(' + Math.min(1, video.currentTime / DEBUT_RECUL) + ')';
        racine.classList.toggle('sur-blanc', video.currentTime >= DEBUT_BLANC - 0.2);
        const presque = video.currentTime >= DEBUT_RECUL - 0.45;   // le bouton et la barre s'effacent juste avant
        passer.style.opacity = piste.style.opacity = presque ? '0' : '';
        if (video.currentTime >= DEBUT_RECUL) reculer();
      }
      if (etat === 'video') boucle = requestAnimationFrame(suivre);
    }
    function lecture(avecSon) {
      video.muted = !avecSon;
      const p = video.play();
      return (p && p.then) ? p : Promise.resolve();
    }
    function commencer() {
      etat = 'video';
      boucle = requestAnimationFrame(suivre);
      // Si la vidéo ne démarre pas vite (fichier absent, ordinateur très lent), on n'insiste pas
      minuteurs.push(setTimeout(() => { if (etat === 'video' && video.currentTime === 0) sauter(); }, 3000));
    }
    // L'écran d'entrée : un clic ou une touche, et le navigateur accepte le son
    function afficherPorte() {
      porte = cree('div', 'intro-porte', racine);
      racine.insertBefore(porte, passer);
      porte.innerHTML = '<div><div class="point"></div><p>Clique ou appuie sur une touche pour lancer l’intro.</p>' +
        '<small><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Avec le son. Échap pour passer.</small></div>';
      porte.addEventListener('click', demarrerAvecSon);
    }
    function demarrerAvecSon() {
      if (etat !== 'attente') return;
      if (porte) porte.classList.add('partie');
      lecture(true).then(commencer, () => lecture(false).then(commencer, sauter));
    }

    // ---- Lancement ----
    const sources = video.querySelectorAll('source');
    if (sources.length) sources[sources.length - 1].addEventListener('error', sauter);
    video.addEventListener('ended', () => { if (etat === 'video') reculer(); });
    const polices = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    Promise.race([polices, new Promise(r => setTimeout(r, 800))]).then(() => {
      if (etat !== 'attente') return;
      preparerPage();
      // D'abord avec le son ; si le navigateur refuse, on affiche l'écran d'entrée
      lecture(true).then(commencer, () => { video.pause(); video.currentTime = 0; afficherPorte(); });
    });
  }

  window.IntroIdeaStudio = { lancer };
})();
</script>

<!-- ============ Démo : on branche l'intro sur la page ============ -->
<script>
  // Quand le recul commence, on rejoue l'effet « encre » de la salutation.
  function rejouerAccueil() {
    ['salut', 'sous'].forEach(id => {
      const e = document.getElementById(id);
      const classe = id === 'salut' ? 'a-ink' : 'a-rise';
      e.classList.remove(classe);
      void e.offsetWidth; // petite astuce pour que le navigateur « oublie » l'animation
      e.classList.add(classe);
    });
  }
  // Bonjour le jour, bonsoir le soir
  (function () {
    const h = new Date().getHours();
    document.getElementById('salut').textContent = (h >= 5 && h < 18 ? 'Bonjour' : 'Bonsoir') + ', Ayoub.';
  })();
  function demarrer() {
    IntroIdeaStudio.lancer({ video: ['intro.webm', 'intro.mp4'], cible: '#composer', champ: 'textarea', page: '.colonne', forcer: true, quandArrive: rejouerAccueil });
  }
  document.getElementById('revoir').addEventListener('click', demarrer);
  demarrer();
</script>
</body>
</html>
